version: '3.8'

# Infraestrutura local — API e App rodam localmente via `make dev`

services:
  postgres:
    image: postgres:16
    container_name: shopping_list_db
    restart: always
    ports:
      - '5433:5432'
    env_file:
      - ./api/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  grafana-data:
  prometheus_data:
